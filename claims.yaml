- id: gurnee-space-time
  kind: source
  passage: '@gurnee2023 recover from a language model linear directions encoding the latitude and longitude
    of places and the dates of events, with individual units tracking these coordinates.'
  evidence:
    citation_id: gurnee2023
    locator: Abstract
    verified: true
    verification_note: 'Abstract read through the arXiv DOI record (DataCite) and arXiv: LLMs learn linear
      representations of space and time (world, US and NYC places; historical figures, artworks, headlines)
      and individual ''space neurons'' and ''time neurons'' encode spatial and temporal coordinates.'
- id: li-othello
  kind: source
  passage: Li and colleagues [-@li2023] train a network only on sequences of legal moves in the board
    game Othello, without ever showing it a board, and find in its activations a representation of the
    current position that a probe can read and that, when edited, changes the model's subsequent play
    to match the altered board.
  evidence:
    citation_id: li2023
    locator: Abstract
    verified: true
    verification_note: 'Abstract read through the arXiv DOI record: a GPT variant trained to predict legal
      Othello moves develops an emergent internal representation of the board state, and interventional
      experiments show the representation controls the network''s output.'
- id: nanda-circle
  kind: source
  passage: Nanda and colleagues [-@nanda2023], reverse-engineering a small transformer trained on addition
    modulo a prime, find that it embeds each number as a point on a circle given by the sine and cosine
    of an angle and computes sums by composing rotations through the trigonometric identities for the
    sine and cosine of $a + b$, then reading the angle of the result.
  evidence:
    citation_id: nanda2023
    locator: Abstract
    verified: true
    verification_note: 'Abstract read at arxiv.org/abs/2301.05217: the algorithm learned for modular addition
      uses discrete Fourier transforms and trigonometric identities to convert addition to rotation about
      a circle, confirmed by ablations in Fourier space.'
- id: engels-circles
  kind: source
  passage: Engels and colleagues [-@engels2024] find the same circular structure arising spontaneously
    in large models for days of the week and months of the year, irreducibly two-dimensional features
    used for modular arithmetic over the calendar.
  evidence:
    citation_id: engels2024
    locator: Abstract
    verified: true
    verification_note: 'Abstract read through the arXiv DOI record: sparse autoencoders find circular
      features for days of the week and months of the year in GPT-2 and Mistral 7B, used in modular-arithmetic
      tasks and shown by intervention to be the unit of computation; the features are irreducibly multi-dimensional.'
- id: kantamneni-helix
  kind: source
  passage: '@kantamneni2025 generalize the circle to a helix, showing that a model represents integers
    along an axis linear in the number and wound with several periods at once, and adds two integers by
    rotating their helices into the helix of the sum, an operation they call the Clock algorithm and confirm
    by intervening on the helical directions.'
  evidence:
    citation_id: kantamneni2025
    locator: Abstract
    verified: true
    verification_note: 'Abstract read through the arXiv DOI record: numbers are represented as a generalized
      helix, addition is computed by the ''Clock'' algorithm manipulating the helices for a and b into
      the helix for a+b, verified with causal interventions.'
- id: huh-convergence
  kind: source
  passage: 'Huh and colleagues [-@huh2024] argue that the convergence is general: networks trained on
    different data and even different modalities come to measure similarity among inputs in increasingly
    similar ways, as if approaching a shared representational geometry.'
  evidence:
    citation_id: huh2024
    locator: Abstract
    verified: true
    verification_note: 'Abstract read through the arXiv DOI record: representations in different networks
      are converging, and across modalities vision and language models measure distance between datapoints
      in increasingly alike ways.'
- id: bronstein-erlangen
  kind: source
  passage: In the account of Bronstein and colleagues [-@bronstein2021], the dominant architectures of
    machine learning are instances of the Erlangen principle, each determined by the symmetry group of
    the data it processes.
  evidence:
    citation_id: bronstein2021
    locator: Abstract
    verified: true
    verification_note: 'Abstract read through the arXiv DOI record: a geometric unification in the spirit
      of Klein''s Erlangen Program that provides a common framework for CNNs, RNNs, GNNs and Transformers
      by exposing symmetry regularities.'
- id: durant-two-heads
  kind: source
  passage: 'The target morphology toward which its cells rebuild after amputation is encoded in part in
    a stable pattern of bioelectric voltage across the tissue, in addition to the genome, and a brief
    manipulation of that pattern can permanently rewrite the target: a cut fragment regenerates two heads
    in place of one and, left undisturbed, continues to regenerate two heads in later rounds of cutting,
    with its genome unchanged [@durant2017].'
  evidence:
    citation_id: durant2017
    locator: Abstract
    verified: true
    verification_note: 'Abstract read from Crossref (DOI 10.1016/j.bpj.2017.04.011): brief perturbation
      of bioelectric networks yields double-headed regenerates, subsequent amputations of these animals
      in water reproduce the double-headed morphology, while histology and polarity-gene expression are
      unchanged; bioelectric state overrides genome-default target morphology.'
- id: levin-problem-spaces
  kind: source
  passage: 'Levin''s framework [-@levin2022] gathers the strata of life and mind into a single claim:
    problem-solving takes place in the anatomical, physiological, and transcriptional spaces of the body
    as well as in an animal''s behavioural space, so that a developing or regenerating tissue that navigates
    toward a target form and corrects displacements from it exhibits basal cognition, defined as the competent
    steering of a system through a problem space toward adaptive regions despite perturbation.'
  evidence:
    citation_id: levin2022
    locator: Abstract
    verified: true
    verification_note: 'Abstract read from Crossref (DOI 10.3389/fnsys.2022.768201): TAME posits a symmetry
      between problem-solving in anatomical, physiological, transcriptional and behavioural spaces and
      treats morphogenesis as an example of basal cognition.'
- id: kriegeskorte-rsa
  kind: source
  passage: In neuroscience, representational similarity analysis [@kriegeskorte2008] characterizes a neural
    population by the matrix of dissimilarities among its responses to a set of stimuli, making the representational
    geometry of a brain region a measured object comparable across regions, animals, and models.
  evidence:
    citation_id: kriegeskorte2008
    locator: Abstract
    verified: true
    verification_note: 'Abstract read from Crossref (DOI 10.3389/neuro.06.004.2008): RSA computes representational
      dissimilarity matrices to relate representations across brain regions, measurement modalities, subjects,
      species and computational models.'
- id: tymoczko-orbifold
  kind: source
  passage: A chord of $n$ notes is a point in the quotient of the $n$-torus by the symmetric group, $T^n/S_n$,
    an orbifold whose singular boundaries correspond to chords with doubled or evenly spaced notes; @tymoczko2006
    shows that chords near these singularities admit efficient voice leading, short moves to neighbouring
    chords, so that the harmonic practice composers reached by ear follows the geometry of the space,
    with consonant triads clustered near its centre.
  evidence:
    citation_id: tymoczko2006
    locator: Abstract
    verified: true
    verification_note: 'Abstract read from Crossref (DOI 10.1126/science.1126287): chords are points in
      an orbifold, voice leadings are line segments, composers exploit short segments between near-symmetrical
      chords, and consonant chords have characteristic near-symmetries.'
- id: bramwell-spin-ice
  kind: source
  passage: In the spin ice of certain pyrochlore crystals the analogous local rule produces a very large
    number of degenerate ground states, and the resulting residual disorder gives a measurable zero-point
    entropy of the kind @pauling1935 identified in ordinary water ice [@bramwell2001].
  evidence:
    citation_id: bramwell2001
    locator: Abstract
    verified: true
    verification_note: 'Abstract read from Crossref (DOI 10.1126/science.1064761): spin ice materials
      have a disordered, macroscopically degenerate ground state precisely analogous to the proton disorder
      in water ice that Pauling described.'
- id: morphotopy-definition
  kind: definition
  passage: 'We propose *morphotopy*: the study of how forms, organisms, meanings, and agents occupy, generate,
    and traverse spaces of possible form under constraint.'
  rationale: Stipulative definition of the paper's central term; it names a phase of an existing practice
    and makes no empirical claim by itself.
- id: five-conditions
  kind: definition
  passage: The proposal is therefore stated as a test of five conditions that a treatment must meet to
    be morphotopic.
  rationale: Introduces the five-condition test that operationalizes the definition; the conditions are
    stated in the following sentences and applied in Section 7.2.
- id: frustration-definition
  kind: definition
  passage: 'Stated without the physics, the condition is

    $$

    \min_{x \in X} \sum_i E_i(x) \;>\; \sum_i \min_{x \in X} E_i(x),

    $$

    that is, the best attainable global state is strictly worse than the sum of the separately attainable
    local optima.'
  rationale: Defines frustration as strict inequality between the global minimum and the sum of local
    minima; the equality case is shown to be the unfrustrated case in the next sentence.
- id: dating-convention
  kind: assumption
  passage: The dating is conventional, and the earliest stratum is deliberately coarse, since earth-measure
    has no single date; only the arithmetic on the chosen dates is exact.
  rationale: The stratigraphy computation depends on a chosen representative work and date per stratum;
    only the arithmetic on those dates is exact, so every stratigraphy number is conditional on this choice.
- id: granularity-caveat
  kind: interpretation
  passage: 'The number of strata is also a consequential choice: individuating recent phases finely while
    treating antiquity in a few broad blocks builds part of the acceleration into the stratification before
    any date is read, so the contraction reported below reflects the chosen granularity as well as the
    history.'
  rationale: 'Qualifies the acceleration result: the contraction of intervals partly reflects finer individuation
    of recent strata, not only historical tempo.'
- id: last-twentieth
  kind: interpretation
  passage: Taking the non-Euclidean geometry of 1829 as the threshold of the modern regime, $12$ of the
    $16$ strata fall within the final $197$ years, three quarters of the strata within about the last
    twentieth of the span.
  rationale: 'Verbal restatement of results.json values: 12/16 strata (three quarters) and modern_window_fraction_of_span
    = 0.0515 (about one twentieth).'
- id: one-third-fraction
  kind: interpretation
  passage: On periodic triangular lattices enumerated exactly at $N = 9$, $12$, and $16$ spins, the fraction
    of bonds unsatisfied in the ground state is one third at every size, the same value as the single
    triangle.
  rationale: Verbal statement of frustrated_bond_fraction = 0.3333 for the triangle and for each lattice
    in results.json (/frustration/triangular_lattices/*/frustrated_bond_fraction).
- id: no-thermo-limit
  kind: interpretation
  passage: Tori this small are strongly affected by boundary conditions (the $4\times4$ torus cannot accommodate
    the three-sublattice ground states), so the enumerations establish the persistence of the one-third
    frustrated-bond fraction and a finite residual entropy of the right magnitude; they do not show convergence
    to the thermodynamic limit.
  rationale: Limits the inference from tori of 9-16 spins, whose entropies scatter on both sides of Wannier's
    value and are boundary-dependent.
- id: frustration-scope
  kind: interpretation
  passage: The model does not measure frustration in any applied space.
  rationale: States that the enumeration exhibits the obstruction only in spin models; recurrence in other
    spaces remains an argued, untested claim.
- id: geometry-as-mechanism
