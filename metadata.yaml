abstract: In physics, biology, cognitive science, and machine learning, a recurrent procedure renders
  a non-spatial domain as a structured space of possible forms and treats its behaviour as constrained
  movement within that space; configuration spaces, morphospaces, conceptual spaces, and the latent spaces
  of trained networks are instances. We argue that this recurrence is the latest phase of a long process
  in the history of geometry, the progressive detachment of form from physical extension, and not a collection
  of independent metaphors. The history is traced stratigraphically, from land survey and the Euclidean
  figure through coordinates, non-Euclidean geometry, Riemann's intrinsic manifold, Klein's transformation
  groups, topology, phase space, and information geometry, to biological morphospace and the representational
  geometry of brains and machines, with each stratum remaining in use beneath the next. We name the current
  phase *morphotopy* and state five conditions that distinguish a morphotopic treatment from a spatial
  figure of speech, applying them to cases that pass and cases that fail. One structural obstruction,
  geometric frustration, the failure of locally satisfiable constraints to compose into a global optimum,
  is definable in any such space; exact enumeration exhibits it in minimal spin models, and its recurrence
  elsewhere is argued without being demonstrated. Dating sixteen strata shows that 12 fall within the
  last 197 of 3826 years, with the mean interval between strata contracting from about 1146 years to about
  18, an acceleration that partly reflects how finely recent strata are individuated. The contribution
  is historical and organizational, and a geometric account of the structure of a mind does not explain
  why there is experience.
web_blurb: The history of geometry is traced as the progressive detachment of form from physical extension,
  from land survey to the representational spaces of organisms and neural networks. Five conditions distinguish
  a substantive space of possible forms from a spatial metaphor.
